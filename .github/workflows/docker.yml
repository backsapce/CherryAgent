name: Build and Push Docker Images

# Docker images are published only for release commits: a push to main whose
# head commit message starts with "release:" — the same convention the Pages
# deploy workflow uses to resolve the stable build. Regular pushes skip this
# workflow entirely. workflow_dispatch forces a manual build.

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  DOCKER_USER: backsapce

jobs:
  release-check:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.check.outputs.is-release }}
    steps:
      - name: Detect release commit
        id: check
        env:
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$HEAD_COMMIT_MESSAGE" | head -n 1 | grep -q '^release:'; then
            echo "is-release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-release=false" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    needs: release-check
    if: needs.release-check.outputs.is-release == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: frontend
            dockerfile: Dockerfile
            image: cherry-agent
            context: .
          - name: agent
            dockerfile: Dockerfile.sandbox
            image: cherry-sandbox
            context: .
    steps:
      - uses: actions/checkout@v4

      - name: Get package version
        id: pkg
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # arm64 native runners are scarce; build the arm64 slice under QEMU. The
      # build itself is npm ci + vite build + a static copy, so emulation is
      # slow but reliable. Matches the platforms in package.json build:docker.
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.DOCKER_USER }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.pkg.outputs.version }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
