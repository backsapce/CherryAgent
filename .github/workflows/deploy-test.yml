name: Deploy to CherryAgentTest Pages

# Every push to main is built and published to https://backsapce.github.io/CherryAgentTest/
# (no commit-message filter, unlike deploy.yml which only fires on "release:" commits).
#
# One-time setup:
#   1. Create a fine-grained PAT with "Contents: Read and write" on backsapce/CherryAgentTest.
#   2. Add it as the DEPLOY_TEST_TOKEN secret in backsapce/CherryAgent.
#   3. In backsapce/CherryAgentTest: Settings -> Pages -> Source: "Deploy from a branch",
#      branch "gh-pages", directory "/ (root)". The action below creates the branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install

      - run: npm run build:pages:test

      - uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TEST_TOKEN }}
          external_repository: backsapce/CherryAgentTest
          publish_branch: gh-pages
          publish_dir: dist
          force_orphan: true
          commit_message: 'deploy: ${{ github.sha }}'
